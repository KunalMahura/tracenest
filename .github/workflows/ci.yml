name: TraceNest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      - name: Run Integration Tests
        working-directory: ./server
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/tracenest
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret_key_1234567890
          NODE_ENV: test
        run: npm test

      - name: Build React Dashboard
        working-directory: ./dashboard
        run: |
          npm install --legacy-peer-deps
          npm run build
