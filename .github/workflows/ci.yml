name: TraceNest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm install

      - name: Wait for MongoDB & Redis
        run: |
          for i in {1..30}; do
            if nc -z 127.0.0.1 27017 && nc -z 127.0.0.1 6379; then
              echo "MongoDB and Redis are accepting connections!"
              break
            fi
            echo "Waiting for services..."
            sleep 1
          done

      - name: Run Server Integration Tests
        working-directory: ./server
        env:
          PORT: 3000
          MONGO_URI: mongodb://127.0.0.1:27017/tracenest
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret_key_1234567890
          NODE_ENV: test
        run: npm test

      - name: Build React Dashboard
        working-directory: ./dashboard
        run: |
          npm install --legacy-peer-deps
          npm run build
