name: TraceNest CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - name: Start Infrastructure with Docker Compose
        run: |
          docker compose up -d mongo redis api
          sleep 12

      - name: Run Integration Tests Inside Container
        run: |
          docker compose exec -T api npm test

      - name: Setup Node.js for Dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build React Dashboard
        working-directory: ./dashboard
        run: |
          npm install --legacy-peer-deps
          npm run build
