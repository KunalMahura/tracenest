services:
  # ── MongoDB ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: tracenest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tracenest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tracenest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API Server ───────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tracenest-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      SERVICE: api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./scripts:/app/scripts
      - ./benchmarks:/app/benchmarks
      - api_modules:/app/node_modules
    command: npm run dev

  # ── Log Worker ───────────────────────────────────────────────────────
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tracenest-worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      SERVICE: worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./benchmarks:/app/benchmarks
      - worker_modules:/app/node_modules
    command: npm run worker:dev

  # ── React Dashboard ──────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: tracenest-dashboard
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - api

  # ── College Results Demo App (Traffic Generator) ──────────────────────
  demo-app:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    container_name: tracenest-demo-app
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      TRACENEST_HOST: http://api:3000
      TRACENEST_API_KEY: tn_4233af265068abcd1cf88e0c8c027db8cb7a292926c3f7df
      TRACENEST_PROJECT_ID: 6adcf5799759bc500c5d74ca
      DEMO_PORT: 4000
    depends_on:
      - api

volumes:
  mongo_data:
  redis_data:
  api_modules:
  worker_modules:
