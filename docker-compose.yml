services:
  # ── MongoDB ─────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: tracenest-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tracenest
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tracenest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── API Server ───────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tracenest-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SERVICE: api
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - ./scripts:/app/scripts   # Mount root scripts/ into container
      - api_modules:/app/node_modules
    command: npm run dev

  # ── Log Worker ───────────────────────────────────────────────────────
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: tracenest-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      SERVICE: worker
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server:/app
      - worker_modules:/app/node_modules
    command: npm run worker:dev

volumes:
  mongo_data:
  redis_data:
  api_modules:      # Preserves node_modules installed in the image
  worker_modules:
